<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My WebOS</title>
    <link rel="stylesheet" href="main.css">
    <script src="script.js" defer> </script>
</head>

<body>
    <div id="desktopapp" class="desktop-app">
        <p id="welcomeopen" class="open-button">
            RayanOS (Welcome Text Window)
        </p>
    </div>
    <div class="top-bar">
        <p class="RayanOS">
            Rayan's OS
        </p>
        <p id="timeElement" class="date-time">
            02/09/2026 9:17 PM
        </p>
    </div>
    <div id="welcomepage" class="window-box">
        <p id="welcomepage-header" class="welcome-page-header"> Handle </p>


        <p id="welcomeclose" class="close-button">
            X
        </p>

        <div id="title&image" class="title-image">
            <h1 class="welcome-rayanOS"><i>Welcome to Rayan's OS</i></h1>
            <p> This WebOS is about Tigers! 🐯</p>
            <img src="https://transforms.stlzoo.org/production/animals/amur-tiger-01-01.jpg?w=1200&h=1200&auto=compress%2Cformat&fit=crop&dm=1658935145&s=95d03aceddd44dc8271beed46eae30bc"
                alt="Tiger-Image" />
        </div>


    </div>

    <div id="tigergallery" class="tiger-gallery">
        <img src="https://cdn-icons-png.flaticon.com/512/1375/1375106.png" alt="gallery-icon">
    </div>
    <div id="roarIcon" class="roar-Icon">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/21/Speaker_Icon.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Tiger-roar"
        >
    </div>
    <div id="roarwindow" class="roar-window">
                <p class="welcome-page-header" id="roarwindow-header">Handle</p>
            <p class="close-button" id="roarwindow-close">X</p>
      <div class="title-roar-window">
            <h1 class="roar-title"> Tiger Roar Sound Effects</h1>
            <p>Bengal</p>
            <img id="roarsoundbutton" class="roar-sound-button" src="https://upload.wikimedia.org/wikipedia/commons/2/21/Speaker_Icon.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="roar-sound-button">
            <p>Sumatran</p>
            <img id="roarsoundbutton" class="roar-sound-button" src="https://upload.wikimedia.org/wikipedia/commons/2/21/Speaker_Icon.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="roar-sound-button">
            <p>Siberian/Amur</p>
            <img id="roarsoundbutton" class="roar-sound-button" src="https://upload.wikimedia.org/wikipedia/commons/2/21/Speaker_Icon.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="roar-sound-button">
            <p>South China</p>
            <img id="roarsoundbutton" class="roar-sound-button" src="https://upload.wikimedia.org/wikipedia/commons/2/21/Speaker_Icon.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="roar-sound-button">
            </div>
    </div>
    

    <div id="gallerywindow" class="gallery-window">
        <p id="gallerywindow-header" class="welcome-page-header">Handle</p>
        <p id="galleryclose" class="close-button">X</p>

        <div class="gallery-images">
            <h1 class="gallery-title"> Tiger Photo Gallery</h1>
            <div class="gallery-photo-grid">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBUwV9ivLmaOeP64NeKRH6jr88Sr-b0-4dPjsWh8jij_pjg7YV95AB_9OA&s=10"
                    alt="Tiger1">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/2012_Suedchinesischer_Tiger.JPG/1280px-2012_Suedchinesischer_Tiger.JPG?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=thumbnail"
                    alt="Tiger2">
                 <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRC3FvtSMnDHRRfHm3vJ17TMzD3YnkM27LkjzCmh6SDDg&s=10"
                    alt="Tiger3">
                <img src="https://s3.eu-west-3.amazonaws.com/cdn.bigcatsindia.com/wp-content/uploads/2018/06/08135531/Royal-Bengal-Tiger.jpg"
                    alt="Tiger4">
                    <img src="https://static.wikia.nocookie.net/disney/images/6/6d/Junglebook526.jpg/revision/latest?cb=20170810020505"
                    alt="Tiger5">
                    <img src="https://static.wikia.nocookie.net/disney/images/6/60/Profile_-_Tigger.png/revision/latest?cb=20230430081828"
                    alt="Tiger6" class="Tiger-6">

            </div>
        </div>



    </div>

</body>

</html>
